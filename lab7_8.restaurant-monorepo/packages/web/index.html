<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Меню ресторану (Web)</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "@restaurant/core": "/node_modules/@restaurant/core/index.js"
      }
    }
  </script>
</head>
<body>
  <main class="container">
    <h1>Меню ресторану</h1>

    <form id="dish-form" class="form-grid" novalidate>
      <input id="dish-name" type="text" placeholder="Назва страви (напр., Борщ український)" />
      <input id="dish-price" type="number" step="0.01" placeholder="Ціна, грн" />
      <select id="dish-category"></select>
      <button type="submit">Додати страву</button>
    </form>

    <p id="error-message" class="error" role="alert"></p>

    <div class="search-box">
      <input id="search-input" type="search" placeholder="Пошук за назвою або категорією..." />
    </div>

    <ul id="dish-list" class="dish-list"></ul>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
